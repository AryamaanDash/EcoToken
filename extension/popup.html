<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eaf8f4" />
    <title>EcoToken</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 36 36">
              <path d="M18 5.25v8.1" />
              <path d="M18 13.35 10.2 18v9.25" />
              <path d="m18 13.35 7.8 4.65v9.25" />
              <circle cx="18" cy="5.5" r="2.75" />
              <circle cx="10.2" cy="27.3" r="2.75" />
              <circle cx="25.8" cy="27.3" r="2.75" />
            </svg>
          </span>
          <span class="brand-copy">
            <strong>EcoToken</strong>
            <small>Intelligent model routing</small>
          </span>
        </div>

        <label class="toggle" for="extension-toggle">
          <span class="sr-only">Enable EcoToken</span>
          <input id="extension-toggle" type="checkbox" role="switch" />
          <span class="toggle-track" aria-hidden="true">
            <span class="toggle-knob"></span>
          </span>
        </label>
      </header>

      <section class="status-row" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">Checking status…</span>
      </section>

      <section class="analytics" aria-labelledby="analytics-title">
        <div class="section-heading">
          <div>
            <p>All-time impact</p>
            <h1 id="analytics-title">Your savings</h1>
          </div>
          <span id="prompt-count" class="prompt-count">0 prompts</span>
        </div>

        <div class="metric-grid">
          <article class="metric-card cost-card">
            <span class="metric-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 2v20M17 6.5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
              </svg>
            </span>
            <p>Inference cost saved</p>
            <strong id="cost-saved">$0.0000</strong>
          </article>

          <article class="metric-card carbon-card">
            <span class="metric-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M19.5 4.5C13 4.5 7.5 7 5 12c-1.5 3-.5 6.3 2 8 4.5-1.5 7.5-4.5 9-9" />
                <path d="M5.5 19.5c2-4 5.2-6.8 9.5-8.5" />
              </svg>
            </span>
            <p>Estimated CO₂ saved</p>
            <strong id="co2-saved">0.00 g</strong>
          </article>
        </div>

        <p id="empty-note" class="empty-note">Savings will appear after your first optimized prompt.</p>
      </section>

      <button class="dashboard-button" id="dashboard-button" type="button">
        <span>View analytics dashboard</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14m-5-5 5 5-5 5" />
        </svg>
      </button>

      <footer>
        <span>Processed locally</span>
        <span class="footer-separator" aria-hidden="true"></span>
        <span>Private by default</span>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
